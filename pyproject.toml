[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo2stl"
version = "0.1.0"
description = "Convert elevation GeoTIFFs to closed terrain STL solids"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "rasterio>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
geo2stl = "geo2stl.cli:main"

[tool.setuptools.packages.find]
include = ["geo2stl*"]
